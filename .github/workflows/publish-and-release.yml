name: Publish and Release

on:
  push:
    branches:
      - main

jobs:
  build-publish-release:
    runs-on: ubuntu-latest
    
    # Required to allow GitHub Actions to push commits/tags and create releases
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetches all history for all tags and branches (required for versioning)
          fetch-depth: 0 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Change this to match your project's Node version
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project (tsc)
        run: npm run build

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        id: version
        run: |
          # Automatically bumps the patch version (e.g., 1.0.0 -> 1.0.1)
          # The [skip ci] prevents this commit from re-triggering the workflow
          npm version patch -m "chore(release): %s [skip ci]"
          
          # Extract the new version to use in the GitHub Release step
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push Version Commit and Tag
        run: git push --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: Release v${{ env.NEW_VERSION }}
          # Automatically generates release notes from your merged PRs
          generate_release_notes: true